services:
  web:
    build: .
    command: khipu web
    ports:
      - "127.0.0.1:3333:3333"
    volumes:
      - db-data:/app/khipuchat.db
      - hf-cache:/app/.cache/huggingface
    env_file: .env

  sync:
    build: .
    command: sh -c "while true; do khipu sync all; sleep ${SYNC_INTERVAL:-3600}; done"
    volumes:
      - db-data:/app/khipuchat.db
      - hf-cache:/app/.cache/huggingface
    env_file: .env

volumes:
  db-data:
  hf-cache:

# ── Claude Desktop (stdio MCP) ─────────────────────────────────────────────
# docker run -i --rm -v khipuchat_db-data:/app/khipuchat.db <image> khipu mcp

# ── Environment variable reference ────────────────────────────────────────────
# Copy .env.example to .env and fill in the values you need.
#
# Telegram (required for Telegram sync):
#   TELEGRAM_API_ID=
#   TELEGRAM_API_HASH=
#   TELEGRAM_SESSION=
#
# Discord (optional):
#   DISCORD_TOKEN=
#
# Slack (optional):
#   SLACK_USER_TOKEN=
#
# Email / IMAP (optional):
#   EMAIL_IMAP_HOST=
#   EMAIL_IMAP_USER=
#   EMAIL_IMAP_PASS=
#
# WeChat (optional -- macOS only, set path to WeChat container):
#   WECHAT_CONTAINER=
#
# WhatsApp (optional -- path for LocalAuth session data):
#   WHATSAPP_SESSION=
#
# Security layers (all optional):
#   DB_KEY=          # SQLCipher key for at-rest DB encryption
#   WEB_USER=        # HTTP Basic Auth username for web UI
#   WEB_PASS=        # HTTP Basic Auth password for web UI
#   MCP_SECRET=      # Bearer token required for MCP tool calls
#   SYNC_INTERVAL=   # Seconds between sync runs (default: 3600)
